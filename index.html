<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Dev Sorteio</title>
</head>

<body>
    <img class="logo" src="./assets/gamedielogo.png" alt="logo-dev-sorteio">


    <h2>
        Sortear um número
    </h2>

    <div class="inputs-container">
        <input class="input-min" type="number" placeholder="entre">
        <input class="input-max" type="number" placeholder="e">
    </div>

    <button onclick="generateRandomNumber()">Sortear</button>

    <p class="result-text">O número sorteado é:</p>
    <p class="result-number">0</p>


</body>

<script src="./scripts.js"></script>

</html>
